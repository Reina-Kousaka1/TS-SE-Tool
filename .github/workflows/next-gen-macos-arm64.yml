# Do not modify the request marker until the runner-assignment evidence is reviewed
# by Architect or a clearly documented architecture self-review.
name: Explicit macOS ARM64 validation

on:
  push:
    branches:
      - "feature/next-gen-foundation-*"
    paths:
      - ".ci/requests/macos-arm64-validation.txt"

permissions:
  contents: read

jobs:
  macos-arm64:
    name: .NET 10 desktop on macOS ARM64 (explicit request)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
          architecture: arm64
      - name: Build and run the full test suite
        run: dotnet test --solution TSSE.NextGen.sln --configuration Release
      - name: Publish the Avalonia desktop app for macOS ARM64
        run: dotnet publish desktop/TSSE.Desktop/TSSE.Desktop.csproj --configuration Release --runtime osx-arm64 --self-contained true --output "${{ runner.temp }}/tsse-desktop-osx-arm64"
      - name: Start and gracefully close the published desktop app
        shell: bash
        env:
          TSSE_APP_PATH: ${{ runner.temp }}/tsse-desktop-osx-arm64/TSSE.Desktop
        run: |
          cat > "$RUNNER_TEMP/desktop-smoke.py" <<'PY'
          import os
          import subprocess
          import sys

          env = os.environ.copy()
          env["TSSE_DESKTOP_CI_SMOKE_TEST"] = "1"
          process = subprocess.Popen([env["TSSE_APP_PATH"]], env=env)
          try:
              exit_code = process.wait(timeout=25)
          except subprocess.TimeoutExpired:
              process.terminate()
              try:
                  process.wait(timeout=5)
              except subprocess.TimeoutExpired:
                  process.kill()
                  process.wait()
              sys.exit("The Avalonia desktop process did not close after its window startup smoke test.")

          if exit_code != 0:
              sys.exit(f"The Avalonia desktop process exited with code {exit_code}.")
          print("The native Avalonia window opened and the desktop process closed cleanly.")
          PY

          python3 "$RUNNER_TEMP/desktop-smoke.py"
