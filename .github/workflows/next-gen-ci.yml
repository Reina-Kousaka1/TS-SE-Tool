name: Next-generation foundation CI

on:
  push:
    branches:
      - "feature/next-gen-foundation-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET 10 on ${{ matrix.runner }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
          - runner: windows-2025
            arch: x64
          - runner: windows-11-arm
            arch: arm64
          - runner: macos-26-intel
            arch: x64
          - runner: macos-26
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
          architecture: ${{ matrix.arch }}
      - name: Build and test
        run: dotnet test TSSE.NextGen.sln --configuration Release --logger "console;verbosity=normal"

  runtime:
    name: Phoenix and real .NET bridge on ${{ matrix.runner }} (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rid: linux-x64
            bridge_file: TSSE.Bridge
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
            bridge_file: TSSE.Bridge
          - runner: windows-2025
            rid: win-x64
            bridge_file: TSSE.Bridge.exe
          - runner: macos-26-intel
            rid: osx-x64
            bridge_file: TSSE.Bridge
          - runner: macos-26
            rid: osx-arm64
            bridge_file: TSSE.Bridge
    runs-on: ${{ matrix.runner }}
    env:
      TSSE_BRIDGE_EXECUTABLE: ${{ runner.temp }}/tsse-bridge/${{ matrix.bridge_file }}
    defaults:
      run:
        working-directory: runtime/tsse_runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24.x"
      - uses: erlef/setup-beam@0f75c29430f34bb5af4cce5e3b7f6a8860fca236 # v1
        with:
          otp-version: "29.1"
          elixir-version: "1.20.5"
          version-type: strict
      - name: Build self-contained .NET bridge for this runner
        run: dotnet publish ../../src/TSSE.Bridge/TSSE.Bridge.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --output "${{ runner.temp }}/tsse-bridge"
      - name: Install and bundle local JavaScript assets
        run: npm ci && npm run assets:build
      - name: Resolve Elixir dependencies
        run: mix deps.get
      - name: Verify formatting and runtime tests
        run: mix format --check-formatted && mix test
      - name: Upload generated Hex lockfile for review
        if: matrix.rid == 'linux-x64'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: generated-runtime-mix-lock
          path: runtime/tsse_runtime/mix.lock
          if-no-files-found: error
          retention-days: 3
