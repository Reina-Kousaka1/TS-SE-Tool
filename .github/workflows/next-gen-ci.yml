name: Next-generation Avalonia foundation CI

on:
  push:
    branches:
      - "feature/next-gen-foundation-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: .NET 10 desktop on ${{ matrix.runner }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            arch: arm64
            rid: linux-arm64
          - runner: windows-2025
            arch: x64
            rid: win-x64
          - runner: windows-11-arm
            arch: arm64
            rid: win-arm64
          - runner: macos-26-intel
            arch: x64
            rid: osx-x64
          - runner: macos-26
            arch: arm64
            rid: osx-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
          architecture: ${{ matrix.arch }}
      - name: Build and run the full test suite
        run: dotnet test --solution TSSE.NextGen.sln --configuration Release
      - name: Publish the Avalonia desktop app for this target
        run: dotnet publish desktop/TSSE.Desktop/TSSE.Desktop.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --output "${{ runner.temp }}/tsse-desktop-${{ matrix.rid }}"
      - name: Start and gracefully close the published Windows desktop app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:TSSE_DESKTOP_CI_SMOKE_TEST = '1'
          $appPath = Join-Path $env:RUNNER_TEMP 'tsse-desktop-${{ matrix.rid }}\TSSE.Desktop.exe'
          $process = Start-Process -FilePath $appPath -PassThru
          if (-not $process.WaitForExit(25000)) {
            $process.Kill()
            throw 'The Avalonia desktop process did not close after its window startup smoke test.'
          }
          if ($process.ExitCode -ne 0) {
            throw "The Avalonia desktop process exited with code $($process.ExitCode)."
          }
      - name: Start and gracefully close the published Linux/macOS desktop app
        if: runner.os != 'Windows'
        shell: bash
        env:
          TSSE_APP_PATH: ${{ runner.temp }}/tsse-desktop-${{ matrix.rid }}/TSSE.Desktop
        run: |
          cat > "$RUNNER_TEMP/desktop-smoke.py" <<'PY'
          import os
          import subprocess
          import sys

          env = os.environ.copy()
          env["TSSE_DESKTOP_CI_SMOKE_TEST"] = "1"
          process = subprocess.Popen([env["TSSE_APP_PATH"]], env=env)
          try:
              exit_code = process.wait(timeout=25)
          except subprocess.TimeoutExpired:
              process.terminate()
              try:
                  process.wait(timeout=5)
              except subprocess.TimeoutExpired:
                  process.kill()
                  process.wait()
              sys.exit("The Avalonia desktop process did not close after its window startup smoke test.")

          if exit_code != 0:
              sys.exit(f"The Avalonia desktop process exited with code {exit_code}.")
          print("The native Avalonia window opened and the desktop process closed cleanly.")
          PY

          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a python3 "$RUNNER_TEMP/desktop-smoke.py"
          else
            python3 "$RUNNER_TEMP/desktop-smoke.py"
          fi
