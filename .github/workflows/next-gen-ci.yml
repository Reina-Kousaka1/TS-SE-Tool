name: Next-generation Avalonia foundation CI

on:
  push:
    branches:
      - "feature/next-gen-foundation-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: .NET 10 desktop on ${{ matrix.runner }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            arch: arm64
            rid: linux-arm64
          - runner: windows-2025
            arch: x64
            rid: win-x64
          - runner: windows-11-arm
            arch: arm64
            rid: win-arm64
          - runner: macos-26-intel
            arch: x64
            rid: osx-x64
          - runner: macos-26
            arch: arm64
            rid: osx-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
          architecture: ${{ matrix.arch }}
      - name: Build and run the full test suite
        run: dotnet test TSSE.NextGen.sln --configuration Release --logger "console;verbosity=normal"
      - name: Publish the Avalonia desktop app for this target
        run: dotnet publish desktop/TSSE.Desktop/TSSE.Desktop.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --output "${{ runner.temp }}/tsse-desktop-${{ matrix.rid }}"
