name: Next-generation Avalonia CI (five desktop targets plus Fedora RPM)

on:
  push:
    branches:
      - "feature/next-gen-foundation-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: .NET 10 desktop on ${{ matrix.runner }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            arch: arm64
            rid: linux-arm64
          - runner: windows-2025
            arch: x64
            rid: win-x64
          - runner: windows-11-arm
            arch: arm64
            rid: win-arm64
          - runner: macos-26-intel
            arch: x64
            rid: osx-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
          architecture: ${{ matrix.arch }}
      - name: Build and run the full test suite
        env:
          TSSE_UI_SNAPSHOT_DIR: ${{ runner.temp }}/tsse-ui-snapshots
        run: dotnet test --solution TSSE.NextGen.sln --configuration Release
      - name: Publish and test the Windows fixture inspector
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $inspectorDir = Join-Path $env:RUNNER_TEMP 'tsse-fixture-inspector'
          dotnet publish tools/TSSE.FixtureInspector/TSSE.FixtureInspector.csproj --configuration Release --runtime win-x64 --self-contained true --output $inspectorDir
          if ($LASTEXITCODE -ne 0) { throw 'Fixture inspector publish failed.' }
          $fixture = Join-Path $env:GITHUB_WORKSPACE 'tests/fixtures/synthetic/sample.sii'
          $result = & (Join-Path $inspectorDir 'TSSE.FixtureInspector.exe') --approved-test-copy $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Fixture inspector did not complete.' }
          $report = $result | ConvertFrom-Json
          if ($report.GameCompatibilityEstablished -ne $false -or $report.SaveWritingEnabled -ne $false -or $report.Report.ByteRoundTripEqual -ne $true) {
            throw 'Unexpected synthetic fixture inspection result.'
          }
      - name: Upload short-lived fixture inspector for authorized test copies
        if: matrix.rid == 'win-x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture-inspector-win-x64
          path: ${{ runner.temp }}/tsse-fixture-inspector/
          if-no-files-found: error
          retention-days: 1
      - name: Upload Avalonia visual-review snapshots
        if: always() && matrix.rid == 'linux-x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: avalonia-ui-snapshots
          path: ${{ runner.temp }}/tsse-ui-snapshots/
          if-no-files-found: warn
          retention-days: 1
      - name: Publish the Avalonia desktop app for this target
        run: dotnet publish desktop/TSSE.Desktop/TSSE.Desktop.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --output "${{ runner.temp }}/tsse-desktop-${{ matrix.rid }}"
      - name: Install Linux package builder
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          packages=(rpm)
          if [[ "${{ matrix.rid }}" == "linux-x64" ]]; then
            packages+=(imagemagick xdotool)
          fi
          sudo apt-get install --no-install-recommends -y "${packages[@]}"
      - name: Build and install-test Linux DEB and RPM packages
        if: runner.os == 'Linux'
        run: |
          bash packaging/linux/build-packages.sh "${{ runner.temp }}/tsse-desktop-${{ matrix.rid }}" "${{ runner.temp }}/tsse-packages-${{ matrix.rid }}" "${{ matrix.rid }}"
          bash packaging/linux/verify-packages.sh "${{ runner.temp }}/tsse-packages-${{ matrix.rid }}" "${{ matrix.rid }}"
      - name: Build and mount-test macOS app bundle and DMG
        if: runner.os == 'macOS'
        run: |
          bash packaging/macos/build-bundle.sh "${{ runner.temp }}/tsse-desktop-${{ matrix.rid }}" "${{ runner.temp }}/tsse-packages-${{ matrix.rid }}" "${{ matrix.rid }}"
          bash packaging/macos/verify-bundle.sh "${{ runner.temp }}/tsse-packages-${{ matrix.rid }}" "${{ matrix.rid }}"
      - name: Start and gracefully close the published Windows desktop app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:TSSE_DESKTOP_CI_SMOKE_TEST = '1'
          $appPath = Join-Path $env:RUNNER_TEMP 'tsse-desktop-${{ matrix.rid }}\TSSE.Desktop.exe'
          $process = Start-Process -FilePath $appPath -PassThru
          if (-not $process.WaitForExit(25000)) {
            $process.Kill()
            throw 'The Avalonia desktop process did not close after its window startup smoke test.'
          }
          if ($process.ExitCode -ne 0) {
            throw "The Avalonia desktop process exited with code $($process.ExitCode)."
          }
      - name: Start and gracefully close the published Linux/macOS desktop app
        if: runner.os != 'Windows'
        shell: bash
        env:
          TSSE_APP_PATH: ${{ runner.temp }}/tsse-desktop-${{ matrix.rid }}/TSSE.Desktop
        run: |
          if [[ "$RUNNER_OS" == "Linux" && "${{ matrix.rid }}" == "linux-x64" ]]; then
            export TSSE_DESKTOP_SCREENSHOT_PATH="$RUNNER_TEMP/tsse-native-desktop.png"
          fi
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a -s "-screen 0 1600x1000x24" python3 packaging/shared/desktop-smoke.py
          else
            python3 packaging/shared/desktop-smoke.py
          fi
      - name: Upload native Linux x64 desktop screenshot
        if: matrix.rid == 'linux-x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: avalonia-native-linux-x64-window
          path: ${{ runner.temp }}/tsse-native-desktop.png
          if-no-files-found: error
          retention-days: 1

  fedora-rpm:
    name: Fedora 45 RPM on ${{ matrix.runner }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            arch: arm64
            rid: linux-arm64
    container:
      image: fedora:45@sha256:a7d72ba2745b100a3351087472e5ee7b2450af7cf331e7673007e3817612839c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Fedora build and smoke-test tools
        run: dnf install -y bash ca-certificates coreutils curl dpkg findutils git gzip libicu openssl-libs python3 rpm-build tar unzip xorg-x11-server-Xvfb
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
          architecture: ${{ matrix.arch }}
      - name: Build and run the full test suite on Fedora
        run: dotnet test --solution TSSE.NextGen.sln --configuration Release
      - name: Publish the Linux app and build Fedora RPM
        run: |
          dotnet publish desktop/TSSE.Desktop/TSSE.Desktop.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --output "${{ runner.temp }}/tsse-fedora-publish-${{ matrix.rid }}"
          bash packaging/linux/build-packages.sh "${{ runner.temp }}/tsse-fedora-publish-${{ matrix.rid }}" "${{ runner.temp }}/tsse-fedora-packages-${{ matrix.rid }}" "${{ matrix.rid }}"
      - name: Resolve RPM dependencies, launch the installed app, and remove the package
        run: bash packaging/linux/verify-rpm-fedora.sh "${{ runner.temp }}/tsse-fedora-packages-${{ matrix.rid }}" "${{ matrix.rid }}"
